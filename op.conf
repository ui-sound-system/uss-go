## Examples

player: go run ./examples/player "$@"
#? play exported JSON on Windows, or render with --wav FILE

build-windows:
  mkdir -p dist
  GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/go.exe ./examples/player
#? build the Windows playback example

latency: go run ./examples/latency "$@"
#? run the Windows latency tester, or CPU-only --bench on any platform

build-latency-windows:
  mkdir -p dist
  GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/uss-latency.exe ./examples/latency
  cp examples/latency/README.md dist/uss-latency-README.txt
#? build the standalone Windows x64 latency tester and instructions

build-oto-windows:
  mkdir -p dist
  cd examples/oto
  GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../../dist/uss-oto.exe .
#? build the standalone Cgo-free Oto streaming example

## Testing & Linting

test: go test ./... "$@"
#? run unit and acceptance tests

fmt: gofmt -w .
#? format Go source

vet: go vet ./...
#? check for suspicious code patterns

check:
  gofmt -w .
  go vet ./...
  go test ./...
  cd examples/oto
  CGO_ENABLED=0 go vet ./...
  CGO_ENABLED=0 go test ./...
#? format, vet, and test everything

acceptance: go test ./synth -run '^TestAcceptance$' -count=1
#? compare the renderer with the recorded reference suite
